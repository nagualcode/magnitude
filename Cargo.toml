[package]
name = "magnitude"
version = "2.1.1"
edition = "2024"
authors = ["nagualcode"]
description = "Magnitude: upward mastering compressor descended from Tom & Jeremy Gersic's 2006 PRESSURE, built with Truce"
license = "MIT"
readme = "README.md"
repository = "https://github.com/nagualcode/magnitude"
keywords = ["audio", "plugin", "vst", "clap", "compressor"]
categories = ["multimedia::audio"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "magnitude-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = ["clap", "vst3", "au", "standalone"]
clap = ["dep:truce-clap", "dep:clap-sys"]
vst3 = ["dep:truce-vst3"]
vst2 = ["dep:truce-vst2"]
lv2 = ["dep:truce-lv2"]
aax = ["dep:truce-aax"]
au = ["dep:truce-au"]
standalone = ["dep:truce-standalone"]
shell = ["truce/shell"]
rt-paranoid = ["truce/rt-paranoid"]

[dependencies]
truce = { version = "6.3" }
truce-core = { version = "6.3" }
truce-params = { version = "6.3" }
truce-egui = { version = "6.3" }
egui = "0.34"
truce-loader = { version = "6.3" }
truce-clap = { version = "6.3", optional = true }
truce-vst3 = { version = "6.3", optional = true }
truce-vst2 = { version = "6.3", optional = true }
truce-au = { version = "6.3", optional = true }
truce-lv2 = { version = "6.3", optional = true }
truce-aax = { version = "6.3", optional = true }
truce-standalone = { version = "6.3", features = ["gui"], optional = true }
clap-sys = { version = "0.5", optional = true }

[dev-dependencies]
truce-test = { version = "6.3" }
truce-driver = { version = "6.3" }
truce-build = { version = "6.3" }
truce-utils = { version = "6.3" }
hound = "3"

[profile.shell]
inherits = "release"

# truce-clap 6.3.0 calls `clap_host_latency::changed` while the plugin is
# active, which the CLAP spec forbids (clap-validator fails). The vendored
# copy only calls `request_restart` in that case. Drop once fixed upstream.
[patch.crates-io]
truce-clap = { path = "vendor/truce-clap" }
